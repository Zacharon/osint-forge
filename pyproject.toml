[project]
name = "osint-forge"
version = "3.1.0"
description = "Governed async OSINT mission orchestration with privacy, SAT, review, and auditability gates."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
osint-forge = "osint_forge.main:main"
osint-forge-review = "osint_forge.review.review_cli:main"
osint-forge-api = "osint_forge.api.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
"osint_forge.ontology" = ["sql/*.sql", "sql/postgres/*.sql"]
